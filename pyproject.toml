[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms-teams-cli"
version = "0.1.0"
description = "Microsoft Teams CLI and Python library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "msal>=1.31",
    "mcp>=1.0",
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13",
    "loguru>=0.7",
]

[project.scripts]
ms-teams = "ms_teams_cli.presentation.cli:app"
ms-teams-mcp = "ms_teams_cli.presentation.mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
    "pytest-cov>=6",
    "pyright>=1.1",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
venvPath = "."
venv = ".venv"
strict = ["src/**"]
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/ms_teams_cli"]
